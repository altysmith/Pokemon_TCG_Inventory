<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pokemon Card Collection</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main class="collection-page">
      <header>
        <div>
          <p class="eyebrow">LOCAL POKEMON TCG INVENTORY</p>
          <h1>Your collection.<br>Viewed your way.</h1>
        </div>
        <div class="iteration"><a class="header-link" href="/">Back to scanner</a></div>
      </header>

      <section class="collection-toolbar" aria-label="Inventory display controls">
        <div class="collection-summary">
          <strong id="total_copies">-</strong><span>total copies</span>
          <strong id="unique_cards">-</strong><span>unique cards</span>
        </div>
        <label>DISPLAY AND GROUP BY
          <select id="inventory_sort">
            <option value="name">Alphabetical name</option>
            <option value="set_number">Set, then card number</option>
            <option value="category">Card category</option>
            <option value="subtype">Item, Supporter, Tool, Stadium, or Energy kind</option>
            <option value="element">Pokemon elemental type</option>
          </select>
        </label>
      </section>

      <p id="inventory_status" class="collection-status">Loading your local collection...</p>
      <div id="inventory_groups" class="collection-groups"></div>
    </main>
    <script src="/inventory.js"></script>
  </body>
</html>
